<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="A pendulum swinging, resampled into music. Rods from 8.4 cm to 33.6 cm, swings 1.719 to 0.859 Hz, resampled 256 times to become audible.">
  <style>
    .swing { animation: swing 13.5434s ease-in-out infinite; transform-origin: 0 0; }
    .scroll { animation: scroll 6s linear infinite; }
    @keyframes swing { 0% { transform: rotate(-20.6deg); } 50% { transform: rotate(20.6deg); } 100% { transform: rotate(-20.6deg); } }
    @keyframes scroll { from { transform: translateX(0px); } to { transform: translateX(-241.00px); } }
    @media (prefers-reduced-motion: reduce) { .swing, .scroll { animation: none; } }
  </style>
